<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JSON Formatter — Data Engineer Toolkit</title><meta name="description" content="Paste JSON, validate it, and format it cleanly."><link rel="stylesheet" href="../style.css">
<style>.tool{max-width:1000px;margin:auto;padding:60px 7%}textarea,input,select{width:100%;background:#0f1627;color:#eef2ff;border:1px solid #303b58;border-radius:10px;padding:12px;margin:8px 0 16px;font:inherit}textarea{min-height:260px;resize:vertical}button{background:#fff;color:#101525;border:0;border-radius:9px;padding:11px 18px;font-weight:700;cursor:pointer;margin:4px 6px 12px 0}pre{white-space:pre-wrap;background:#0f1627;border:1px solid #303b58;padding:16px;border-radius:10px;overflow:auto}label{font-weight:700}.muted{color:#9da8c0}.back{color:#9da8c0;text-decoration:none}</style></head>
<body><header class="nav"><a class="brand" href="../">Data Engineer Toolkit</a><nav><a href="../#tools">Tools</a></nav></header>
<main class="tool"><a class="back" href="../">← All tools</a><h1>JSON Formatter</h1><p class="muted">Paste JSON, validate it, and format it cleanly.</p><textarea id="input" placeholder='{"name":"Ravi","role":"Data Engineer"}'></textarea><br><button onclick="formatJson()">Format JSON</button><button onclick="minify()">Minify</button><p id="msg" class="muted"></p><pre id="output"></pre></main><script>const i=document.getElementById('input'),o=document.getElementById('output'),m=document.getElementById('msg');
function formatJson(){try{o.textContent=JSON.stringify(JSON.parse(i.value),null,2);m.textContent='Valid JSON';}catch(e){o.textContent='';m.textContent='Invalid JSON: '+e.message}}
function minify(){try{o.textContent=JSON.stringify(JSON.parse(i.value));m.textContent='Valid JSON';}catch(e){o.textContent='';m.textContent='Invalid JSON: '+e.message}}</script></body></html>
