<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cron Helper — Data Engineer Toolkit</title><meta name="description" content="Create common cron expressions without memorising the syntax."><link rel="stylesheet" href="../style.css">
<style>.tool{max-width:1000px;margin:auto;padding:60px 7%}textarea,input,select{width:100%;background:#0f1627;color:#eef2ff;border:1px solid #303b58;border-radius:10px;padding:12px;margin:8px 0 16px;font:inherit}textarea{min-height:260px;resize:vertical}button{background:#fff;color:#101525;border:0;border-radius:9px;padding:11px 18px;font-weight:700;cursor:pointer;margin:4px 6px 12px 0}pre{white-space:pre-wrap;background:#0f1627;border:1px solid #303b58;padding:16px;border-radius:10px;overflow:auto}label{font-weight:700}.muted{color:#9da8c0}.back{color:#9da8c0;text-decoration:none}</style></head>
<body><header class="nav"><a class="brand" href="../">Data Engineer Toolkit</a><nav><a href="../#tools">Tools</a></nav></header>
<main class="tool"><a class="back" href="../">← All tools</a><h1>Cron Helper</h1><p class="muted">Create common cron expressions without memorising the syntax.</p><label>Schedule</label><select id="sel"><option value="0 * * * *">Every hour</option><option value="0 0 * * *">Every day at midnight</option><option value="0 9 * * *">Every day at 9 AM</option><option value="0 9 * * 1-5">Weekdays at 9 AM</option><option value="0 0 * * 0">Every Sunday at midnight</option><option value="*/5 * * * *">Every 5 minutes</option><option value="0 */6 * * *">Every 6 hours</option></select><button onclick="go()">Show expression</button><pre id="out">0 * * * *</pre></main><script>const s=document.getElementById('sel'),o=document.getElementById('out');function go(){o.textContent=s.value}</script></body></html>
