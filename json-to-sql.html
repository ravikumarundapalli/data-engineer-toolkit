<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JSON → SQL Generator — Data Engineer Toolkit</title><meta name="description" content="Convert a JSON array of objects into SQL INSERT statements."><link rel="stylesheet" href="../style.css">
<style>.tool{max-width:1000px;margin:auto;padding:60px 7%}textarea,input,select{width:100%;background:#0f1627;color:#eef2ff;border:1px solid #303b58;border-radius:10px;padding:12px;margin:8px 0 16px;font:inherit}textarea{min-height:260px;resize:vertical}button{background:#fff;color:#101525;border:0;border-radius:9px;padding:11px 18px;font-weight:700;cursor:pointer;margin:4px 6px 12px 0}pre{white-space:pre-wrap;background:#0f1627;border:1px solid #303b58;padding:16px;border-radius:10px;overflow:auto}label{font-weight:700}.muted{color:#9da8c0}.back{color:#9da8c0;text-decoration:none}</style></head>
<body><header class="nav"><a class="brand" href="../">Data Engineer Toolkit</a><nav><a href="../#tools">Tools</a></nav></header>
<main class="tool"><a class="back" href="../">← All tools</a><h1>JSON → SQL Generator</h1><p class="muted">Convert a JSON array of objects into SQL INSERT statements.</p><label>Table name</label><input id="table" value="employees"><label>JSON array</label><textarea id="input" placeholder='[{"name":"Ravi","age":27},{"name":"Sam","age":30}]'></textarea><button onclick="go()">Generate SQL</button><pre id="out"></pre></main><script>function esc(v){if(v===null||v===undefined)return 'NULL';if(typeof v==='number'||typeof v==='boolean')return String(v);return "'"+String(v).replaceAll("'","''")+"'"}function go(){try{const a=JSON.parse(document.getElementById('input').value),t=document.getElementById('table').value.trim();if(!Array.isArray(a)||!a.length)throw Error('Provide a non-empty JSON array');const cols=[...new Set(a.flatMap(x=>Object.keys(x)))];document.getElementById('out').textContent=a.map(x=>'INSERT INTO '+t+' ('+cols.join(', ')+') VALUES ('+cols.map(c=>esc(x[c])).join(', ')+');').join('\n')}catch(e){document.getElementById('out').textContent='Error: '+e.message}}</script></body></html>
