<body><header class="nav"><a class="brand" href="../">Data Engineer Toolkit</a><nav><a href="../#tools">Tools</a></nav></header>
<main class="tool"><a class="back" href="../">← All tools</a><h1>CSV → SQL Generator</h1><p class="muted">Convert a CSV file pasted below into SQL INSERT statements.</p><label>Table name</label><input id="table" value="employees"><label>CSV</label><textarea id="input" placeholder="name,age,city&#10;Ravi,27,Hyderabad&#10;Sam,30,Pune"></textarea><button onclick="go()">Generate SQL</button><pre id="out"></pre></main><script>function esc(v){if(v===''||v.toLowerCase()==='null')return 'NULL';if(!isNaN(v)&&v.trim()!=='')return v;return "'"+v.replaceAll("'","''")+"'"}function go(){const lines=document.getElementById('input').value.trim().split(/\r?\n/);if(lines.length<2){out.textContent='Add a header and at least one row.';return}const cols=lines[0].split(',').map(x=>x.trim());out.textContent=lines.slice(1).map(line=>{const vals=line.split(',').map(x=>x.trim());return 'INSERT INTO '+table.value+' ('+cols.join(', ')+') VALUES ('+vals.map(esc).join(', ')+');'}).join('\n')}</script></body></html>
