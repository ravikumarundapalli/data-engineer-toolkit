<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unix Timestamp Converter — Data Engineer Toolkit</title><meta name="description" content="Convert between Unix seconds and human-readable dates."><link rel="stylesheet" href="../style.css">
<style>.tool{max-width:1000px;margin:auto;padding:60px 7%}textarea,input,select{width:100%;background:#0f1627;color:#eef2ff;border:1px solid #303b58;border-radius:10px;padding:12px;margin:8px 0 16px;font:inherit}textarea{min-height:260px;resize:vertical}button{background:#fff;color:#101525;border:0;border-radius:9px;padding:11px 18px;font-weight:700;cursor:pointer;margin:4px 6px 12px 0}pre{white-space:pre-wrap;background:#0f1627;border:1px solid #303b58;padding:16px;border-radius:10px;overflow:auto}label{font-weight:700}.muted{color:#9da8c0}.back{color:#9da8c0;text-decoration:none}</style></head>
<body><header class="nav"><a class="brand" href="../">Data Engineer Toolkit</a><nav><a href="../#tools">Tools</a></nav></header>
<main class="tool"><a class="back" href="../">← All tools</a><h1>Unix Timestamp Converter</h1><p class="muted">Convert between Unix seconds and human-readable dates.</p><label>Unix timestamp (seconds)</label><input id="ts" placeholder="e.g. 1790931600"><button onclick="fromTs()">Timestamp → Date</button><label>Date/time</label><input id="date" type="datetime-local"><button onclick="toTs()">Date → Timestamp</button><pre id="out"></pre></main><script>const out=document.getElementById('out');function fromTs(){const n=Number(document.getElementById('ts').value);if(!Number.isFinite(n)){out.textContent='Enter a valid timestamp';return}out.textContent=new Date(n*1000).toString()}function toTs(){const d=new Date(document.getElementById('date').value);if(isNaN(d)){out.textContent='Choose a date';return}out.textContent=String(Math.floor(d.getTime()/1000))}</script></body></html>
